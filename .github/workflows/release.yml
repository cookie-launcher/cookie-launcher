name: "Release & Build Setup.exe"

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          # macOS: her mimari KENDI runner'inda derlenir; cunku PyInstaller
          # cross-compile yapamaz -> Intel DMG'nin gomulu cekirdegi de Intel
          # runner'da uretilmelidir.
          - platform: "macos-latest"      # Apple Silicon (M serisi)
            target: "aarch64-apple-darwin"
          - platform: "macos-15-intel"    # Intel Mac
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone backend core (Python gerekmeden calisir)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests minecraft-launcher-lib urllib3 certifi noiseprotocol
          # --collect-data certifi: kok sertifika demetini (cacert.pem) pakete
          # gomer. macOS/Windows'ta paketlenmis Python sistem CA'larini
          # goremedigi icin bu olmadan Modrinth/Mojang istekleri
          # SSLCertVerificationError ile basarisiz olup listeler bos geliyordu.
          pyinstaller --onefile --name cookielauncher-core --collect-data certifi --hidden-import noise --collect-submodules noise --distpath backend --workpath build/pyinstaller --specpath build backend/server.py

      - name: Build Tauri App (Produces Windows Setup.exe on windows-latest)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CookieLauncher v__VERSION__"
          releaseBody: |
            Açık kaynak, hafif Minecraft başlatıcı (Tauri + Python çekirdek, GPL-3.0).

            **Paketler**
            - **Windows:** Kurulum (.exe) — gömülü çekirdek sayesinde Python gerekmez
            - **Linux:** AppImage / .deb / .rpm
            - **macOS:** .dmg (Apple Silicon) ve .dmg (Intel) — *deneysel*

            > **macOS notu:** DMG paketleri imzasız ve notarize edilmemiştir; nedeni Apple Developer
            > Program üyeliğinin (**99 $/yıl**) karşılanamamasıdır. İlk açılışta Gatekeeper
            > "geliştirici doğrulanamıyor" uyarısı verir. **Sağ tık → "Aç" macOS 15 (Sequoia) ve
            > sonrasında artık çalışmaz.** Şu iki yoldan birini kullanın: (1) Terminal:
            > `xattr -dr com.apple.quarantine /Applications/CookieLauncher.app`
            > (2) Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç".
            > Uygulama GPL-3.0 açık kaynaktır; dileyen kaynak koddan derleyebilir.
            > macOS derlemeleri geliştirici tarafından test edilmemiştir; sorun bildirirseniz seviniriz.

            Mod kaynağı Modrinth'tir. Minecraft, Mojang Synergies AB'nin ticari markasıdır;
            bu proje Mojang/Microsoft ile bağlantılı, sponsorlu veya onaylı değildir.
          releaseDraft: false
          prerelease: false

      - name: Windows portable ZIP (WebView2 kurucusu dahil)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path portable/CookieLauncher | Out-Null
          Copy-Item "src-tauri/target/release/cookie-launcher.exe" "portable/CookieLauncher/CookieLauncher.exe"
          if (Test-Path "src-tauri/target/release/backend") {
            Copy-Item -Recurse "src-tauri/target/release/backend" "portable/CookieLauncher/backend"
          }
          # WebView2 Evergreen Standalone Installer (x64) - cevrimdisi kurulum icin
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124703" -OutFile "portable/CookieLauncher/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          $readme = @"
          Cookie Launcher - Tasinabilir (Portable) Surum v$ver
          =====================================================
          Kurulum gerektirmez: klasoru istediginiz yere kopyalayip CookieLauncher.exe'yi calistirin.
          (USB bellekten de calisir.)

          UYGULAMA ACILMIYORSA:
          1) Bu klasordeki MicrosoftEdgeWebView2RuntimeInstallerX64.exe dosyasini calistirin.
             (Windows 11 ve guncel Windows 10'da WebView2 genellikle hazir gelir.)
          2) Windows Defender/SmartScreen uyarisi verirse "Daha fazla bilgi" -> "Yine de calistir".

          Lisans: GPL-3.0 (bkz. depodaki LICENSE). Yazilim "AS IS", garanti yoktur.
          Minecraft, Mojang Synergies AB'nin ticari markasidir; bu proje Mojang/Microsoft
          ile baglantili veya onayli degildir.
          "@
          Set-Content -Path "portable/CookieLauncher/OKUBENI.txt" -Value $readme -Encoding UTF8
          Compress-Archive -Path "portable/CookieLauncher" -DestinationPath "CookieLauncher_${ver}_x64_portable.zip" -Force
          gh release upload "v$ver" "CookieLauncher_${ver}_x64_portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
