[package]
name = "cookie-launcher"
version = "3.1.0"
description = "Modern, aesthetic and high performance Minecraft launcher"
authors = ["CookieLauncher Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
