<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie Launcher — Davet</title>
<style>
  :root { color-scheme: dark; --bg:#0c0a08; --panel:#18140f; --line:#2b241c; --text:#f3e9d8; --muted:#8d7e6b; --amber:#eaa33c; --green:#94c47d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(700px 380px at 50% -10%, rgba(234,163,60,.10), transparent 65%), var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; padding:24px; }
  main { width:min(560px,100%); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; box-shadow:0 20px 70px rgba(0,0,0,.45); }
  .brand { display:flex; align-items:center; gap:10px; color:var(--amber); font-weight:800; letter-spacing:-.02em; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--amber); box-shadow:0 0 14px rgba(234,163,60,.7); }
  h1 { font-size:22px; margin:16px 0 4px; letter-spacing:-.04em; }
  p { color:var(--muted); font-size:13px; line-height:1.55; margin:6px 0; }
  code, .code { font-family: ui-monospace, "Cascadia Code", monospace; }
  .code[hidden], #actions[hidden] { display:none; }
  .code { display:block; margin:16px 0; padding:12px; border:1px solid var(--line); border-radius:8px; background:#0f0d0a; color:var(--amber); font-size:12px; word-break:break-all; user-select:all; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button, a.btn { border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--text); padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; }
  button.primary { background:var(--amber); border-color:var(--amber); color:#241708; font-weight:800; }
  button:hover, a.btn:hover { border-color:var(--amber); }
  .ok { color:var(--green); }
  .warn { color:var(--amber); }
  .small { font-size:11px; color:var(--muted); margin-top:14px; }
  .bad { border-color:rgba(224,122,106,.4); color:#e07a6a; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span> COOKIE LAUNCHER</div>
  <h1>Arkadaş daveti</h1>
  <p id="sub">Davet kodu aranıyor…</p>
  <div class="code" id="code" hidden></div>
  <div class="row" id="actions" hidden>
    <button class="primary" id="open">Launcher'da aç</button>
    <button id="copy">Kodu kopyala</button>
  </div>
  <p class="small" id="hint" hidden>Launcher açıksa: kodu kopyaladıktan sonra launcher penceresine dön; panoyu tarayıp daveti otomatik yakalar. <span class="warn">cl:// bağlantısı bazı uygulamalarda çalışmaz; bu sayfa fallback'tir.</span></p>
  <p class="small" id="status"></p>
</main>
<script>
(() => {
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, "") ||
    new URLSearchParams(location.search).get("c") || "").trim();
  const m = raw.match(/CL1-[A-Za-z0-9_-]+/i);
  const code = m ? m[0].replace(/^cl1-/i, "CL1-") : "";
  const codeEl = document.getElementById("code");
  const actions = document.getElementById("actions");
  const sub = document.getElementById("sub");
  const hint = document.getElementById("hint");
  const status = document.getElementById("status");
  if (!code) {
    sub.textContent = "Davet kodu bulunamadı. Discord/WhatsApp'taki bağlantının tamamını açtığından emin ol.";
    hint.hidden = false;
    return;
  }
  sub.textContent = "Bu kodu Cookie Launcher'a aktarabilirsin.";
  codeEl.textContent = code;
  codeEl.hidden = false;
  actions.hidden = false;
  hint.hidden = false;
  document.getElementById("open").addEventListener("click", () => {
    status.textContent = "Launcher açılıyor… Açılmazsa kodu kopyalayıp launcher'a dön.";
    try { location.href = "cl://join/" + encodeURIComponent(code); } catch (_) {}
  });
  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code);
      status.textContent = "Kopyalandı. Launcher penceresine dön.";
      status.className = "small ok";
    } catch (_) {
      status.textContent = "Kopyalanamadı; kodu seçip elle kopyala.";
      status.className = "small bad";
    }
  });
})();
</script>
</body>
</html>
